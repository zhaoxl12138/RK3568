  <div class="page-shell"><main id="main-content">
    <header class="hero"><p class="hero__eyebrow">EVIDENCE DESK · JPG / MP4</p><h1>实验与证据</h1><p>这里展示 vault-data.js 记录的真实 JPG / MP4 产物；文件不存在、类型未知或加载失败时仍保留可读状态。</p><div class="hero__actions"><a class="button" href="../../../05-实验与证据/00-实验与证据入口.md">实验与证据入口</a><a class="button" href="../../../05-实验与证据/实验产物/01-实验产物索引.md">实验产物索引</a><a class="button" href="../../../05-实验与证据/02-每日进度记录.md">每日进度记录</a></div></header>
    <section aria-labelledby="evidence-title"><div class="section-title"><h2 id="evidence-title">资产卡片</h2><p><span data-evidence-count>0</span> 项已登记资产</p></div><div id="evidence-grid" class="grid" aria-live="polite"></div></section>
    <script>
      (function () {
        'use strict';
        function renderEvidence() {
          var grid = document.getElementById('evidence-grid');
          var data = window.RK3568_VAULT_DATA || {};
          var evidence = Array.isArray(window.RK3568_VAULT_DATA && window.RK3568_VAULT_DATA.evidence) ? window.RK3568_VAULT_DATA.evidence : [];
          if (!grid) return;
          grid.textContent = '';
          if (!evidence.length) {
            var empty = document.createElement('article');
            empty.className = 'card';
            empty.textContent = '暂无已登记证据资产。';
            grid.appendChild(empty);
            return;
          }
          evidence.forEach(function (item) {
            var card = document.createElement('article');
            card.className = 'card';
            try {
              item = item || {};
              var name = item.name || '未命名资产';
              var kind = String(item.type || item.mediaType || '').toLowerCase();
              var source = item.assetPath ? '../' + item.assetPath : '';
              var heading = document.createElement('h3');
              heading.textContent = name;
              card.appendChild(heading);
              var meta = document.createElement('p');
              meta.textContent = item.stageLabel || 'unknown';
              card.appendChild(meta);
              if (!source) {
                card.appendChild(document.createTextNode('资产路径缺失，暂不可用。'));
              } else if (kind.indexOf('image') === 0 || /\.jpe?g$/iu.test(name)) {
                var image = document.createElement('img');
                image.src = source;
                image.alt = name;
                image.loading = 'lazy';
                image.addEventListener('error', function () { image.replaceWith(document.createTextNode('图片文件缺失或无法加载。')); });
                card.appendChild(image);
              } else if (kind.indexOf('video') === 0 || /\.mp4$/iu.test(name)) {
                var video = document.createElement('video');
                video.controls = true;
                video.preload = 'metadata';
                video.src = source;
                video.addEventListener('error', function () { video.replaceWith(document.createTextNode('视频文件缺失或无法加载。')); });
                card.appendChild(video);
              } else {
                card.appendChild(document.createTextNode('资产类型未知，暂不可预览。'));
              }
            } catch (error) {
              card.appendChild(document.createTextNode('资产信息不可用，无法渲染此卡片。'));
            }
            grid.appendChild(card);
          });
        }
        document.addEventListener('DOMContentLoaded', renderEvidence);
      }());
    </script>
    <footer class="footer">证据卡片只读展示索引数据，原始记录和产物仍以 Obsidian 为准。</footer>
