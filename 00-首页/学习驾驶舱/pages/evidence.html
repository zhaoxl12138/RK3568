    <header class="hero"><p class="hero__eyebrow">EVIDENCE DESK · JPG / MP4</p><h1>实验与证据</h1><p>这里展示 vault-data.js 记录的真实 JPG / MP4 产物；文件不存在、类型未知或加载失败时仍保留可读状态。</p><div class="hero__actions"><a class="button" href="notes/05-实验与证据--00-实验与证据入口.html">返回实验记录</a><a class="button" href="notes/05-实验与证据--实验产物--01-实验产物索引.html">实验产物索引</a><a class="button" href="notes/05-实验与证据--02-每日进度记录.html">每日进度记录</a><a class="button" href="../../../00-首页/00-RK3568学习主入口.md">返回 Obsidian 主入口</a></div></header>
    <section aria-labelledby="evidence-title"><div class="section-title"><h2 id="evidence-title">按阶段查看证据</h2><p><span data-evidence-count>0</span> 项已登记资产</p></div><div id="evidence-grid" class="evidence-groups" aria-live="polite"></div></section>
    <script>
      (function () {
        'use strict';
        function sourceRecord(item, data) {
          var sourcePath = String(item.sourcePath || '').trim();
          var sourceUrl = String(item.url || item.sourceUrl || '').trim();
          if (sourceUrl) return { url: sourceUrl, path: sourcePath };
          if (!sourcePath) return { url: '', path: '' };
          var vault = String(data.vaultName || data.vault || 'RK3568');
          var file = sourcePath.replace(/\\/gu, '/').replace(/\.md$/iu, '');
          return { url: 'obsidian://open?vault=' + encodeURIComponent(vault) + '&file=' + encodeURIComponent(file), path: sourcePath };
        }
        function renderEvidence() {
          var grid = document.getElementById('evidence-grid');
          var data = window.RK3568_VAULT_DATA || {};
          var evidence = Array.isArray(window.RK3568_VAULT_DATA && window.RK3568_VAULT_DATA.evidence) ? window.RK3568_VAULT_DATA.evidence : [];
          var stages = Array.isArray(data.stages) ? data.stages : [];
          if (!grid) return;
          grid.textContent = '';
          var groups = Object.create(null);
          var groupOrder = [];
          stages.forEach(function (stage) {
            stage = stage || {};
            var key = String(stage.stageKey || 'unknown');
            if (key === 'unknown' || groups[key]) return;
            groups[key] = { label: stage.normalizedLabel || stage.label || key, items: [] };
            groupOrder.push(key);
          });
          evidence.forEach(function (item) {
            item = item || {};
            var key = String(item.evidenceStageKey || 'unknown');
            if (!groups[key]) {
              groups[key] = { label: key === 'unknown' ? '需要补充阶段' : (item.stageLabel || key), items: [] };
              groupOrder.push(key);
            }
            groups[key].items.push(item);
          });
          if (!groupOrder.length) {
            var empty = document.createElement('article');
            empty.className = 'card evidence-empty';
            empty.textContent = '暂无已登记证据，当前阶段缺失可验证产物。';
            grid.appendChild(empty);
            return;
          }
          groupOrder.forEach(function (key) {
            var group = groups[key];
            var section = document.createElement('section');
            section.className = 'evidence-group';
            section.setAttribute('data-stage-group', key);
            var title = document.createElement('div');
            title.className = 'section-title evidence-group__title';
            var heading = document.createElement('h3');
            heading.textContent = group.label;
            title.appendChild(heading);
            var count = document.createElement('p');
            count.innerHTML = '<span data-stage-count>' + String(group.items.length) + '</span> 项已归档证据';
            title.appendChild(count);
            if (key !== 'unknown' && group.items.length === 0) {
              var emptyNotice = document.createElement('p');
              emptyNotice.className = 'evidence-empty';
              emptyNotice.textContent = '暂无证据，待补充';
              title.appendChild(emptyNotice);
            }
            section.appendChild(title);
            var cards = document.createElement('div');
            cards.className = 'grid';
            group.items.forEach(function (item) {
              var card = document.createElement('article');
              card.className = 'card';
              try {
                var name = item.name || '未命名资产';
                var kind = String(item.type || item.mediaType || '').toLowerCase();
                var source = item.assetPath ? '../' + item.assetPath : '';
                var cardHeading = document.createElement('h4');
                cardHeading.textContent = name;
                card.appendChild(cardHeading);
                var record = sourceRecord(item, data);
                if (record.url) {
                  var recordLink = document.createElement('a');
                  recordLink.className = 'button';
                  recordLink.href = record.url;
                  recordLink.textContent = '打开原始 Obsidian 记录';
                  card.appendChild(recordLink);
                } else {
                  var recordPath = document.createElement('p');
                  recordPath.textContent = record.path ? '原始记录路径：' + record.path : '原始记录路径不可用。';
                  card.appendChild(recordPath);
                }
                if (!source) {
                  card.appendChild(document.createTextNode('资产路径缺失，暂不可用。'));
                } else if (kind.indexOf('image') === 0 || /\.jpe?g$/iu.test(name)) {
                  var image = document.createElement('img');
                  image.src = source;
                  image.alt = name;
                  image.loading = 'lazy';
                  image.addEventListener('error', function () { image.replaceWith(document.createTextNode('图片文件缺失或无法加载。')); });
                  card.appendChild(image);
                } else if (kind.indexOf('video') === 0 || /\.mp4$/iu.test(name)) {
                  var video = document.createElement('video');
                  video.controls = true;
                  video.preload = 'metadata';
                  video.src = source;
                  video.addEventListener('error', function () { video.replaceWith(document.createTextNode('视频文件缺失或无法加载。')); });
                  card.appendChild(video);
                } else {
                  card.appendChild(document.createTextNode('资产类型未知，暂不可预览。'));
                }
              } catch (error) {
                card.appendChild(document.createTextNode('资产信息不可用，无法渲染此卡片。'));
              }
              cards.appendChild(card);
            });
            section.appendChild(cards);
            grid.appendChild(section);
          });
        }
        document.addEventListener('DOMContentLoaded', renderEvidence);
      }());
    </script>
    <footer class="footer">证据卡片只读展示索引数据，原始记录和产物仍以 Obsidian 为准。</footer>
  </main></div>
