<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RK3568 AI Camera — 数据流动画演示</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg:#080c14; --surface:rgba(255,255,255,0.02); --border:rgba(255,255,255,0.06);
    --text:#c8ccd4; --dim:#78909c; --bright:#e8eaed;
    --blue:#42a5f5; --purple:#7c4dff; --green:#66bb6a; --red:#ef5350; --orange:#ffa726; --cyan:#26c6da; --pink:#ab47bc;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter','Noto Sans SC',sans-serif;
    background:var(--bg); color:var(--text); overflow-x:hidden;
  }

  /* ===== TOP BAR ===== */
  .topbar {
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(8,12,20,0.92); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border); padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topbar h1 { font-size:1.1em; font-weight:600; color:var(--bright); }
  .topbar h1 span { background:linear-gradient(135deg,var(--blue),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

  .controls { display:flex; gap:10px; align-items:center; }
  .controls button {
    padding:8px 18px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); cursor:pointer;
    font-size:0.85em; font-weight:500; transition:all 0.2s;
  }
  .controls button:hover { border-color:rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); }
  .controls button.active { background:var(--purple); border-color:var(--purple); color:#fff; }
  .step-indicator { font-size:0.85em; color:var(--dim); min-width:100px; text-align:right; }

  /* ===== MAIN CONTENT ===== */
  .main { padding:100px 24px 60px; max-width:1200px; margin:0 auto; }
  .helper-note {
    margin:0 0 18px;
    padding:14px 18px;
    border-radius:12px;
    border:1px solid var(--border);
    background:rgba(66,165,245,0.08);
    color:#b7c9d8;
    line-height:1.8;
    font-size:0.9em;
  }

  /* ===== PIPELINE ===== */
  .pipeline-container { position:relative; margin:40px 0; }

  .pipeline {
    display:flex; align-items:center; gap:0;
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:8px; position:relative;
    overflow:hidden;
  }

  .node {
    flex:1; padding:28px 8px; text-align:center; position:relative;
    border-radius:10px; transition:all 0.6s cubic-bezier(0.4,0,0.2,1);
    z-index:1; min-width:0;
  }
  .node .n-icon { font-size:2em; margin-bottom:6px; transition:transform 0.6s; display:block; }
  .node .n-label { font-size:0.85em; font-weight:600; color:var(--bright); transition:color 0.6s; }
  .node .n-sub { font-size:0.68em; color:var(--dim); font-family:'JetBrains Mono',monospace; margin-top:3px; transition:color 0.6s; }

  .node.active {
    transform:scale(1.08); z-index:5;
    box-shadow:0 0 40px rgba(124,77,255,0.3), 0 0 80px rgba(124,77,255,0.1);
  }
  .node.active .n-icon { transform:scale(1.15); }
  .node.done { opacity:0.7; }

  .connector {
    width:32px; height:2px; flex-shrink:0; position:relative;
    background:rgba(255,255,255,0.08); transition:all 0.6s;
  }
  .connector.flow {
    background:var(--purple);
    box-shadow:0 0 8px rgba(124,77,255,0.5);
  }
  .connector::after {
    content:''; position:absolute; right:-2px; top:-3px;
    width:8px; height:8px; border-radius:50%;
    background:inherit; opacity:0; transition:opacity 0.3s;
  }
  .connector.flow::after { opacity:1; }

  /* flowing dots on active connectors */
  .connector.flow::before {
    content:''; position:absolute; left:0; top:-2px;
    width:6px; height:6px; border-radius:50%;
    background:#fff;
    animation:flowDot 0.8s linear infinite;
  }
  @keyframes flowDot {
    0% { left:0; opacity:1; }
    100% { left:calc(100% - 6px); opacity:0.3; }
  }

  /* ===== DATA LABEL (floating) ===== */
  .data-badge {
    position:absolute; top:-48px; left:50%; transform:translateX(-50%);
    padding:6px 16px; border-radius:20px; font-size:0.75em;
    font-family:'JetBrains Mono',monospace; white-space:nowrap;
    background:rgba(0,0,0,0.7); border:1px solid var(--purple);
    color:var(--bright); z-index:10;
    opacity:0; transition:all 0.5s;
    pointer-events:none;
  }
  .data-badge.show { opacity:1; }

  /* ===== DETAIL PANEL ===== */
  .detail-panel {
    margin-top:32px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:28px; position:relative;
    min-height:200px;
  }
  .detail-panel .dp-step {
    font-size:0.78em; color:var(--purple); font-weight:600;
    letter-spacing:0.06em; margin-bottom:6px;
  }
  .detail-panel .dp-title { font-size:1.4em; font-weight:700; color:var(--bright); margin-bottom:16px; }
  .detail-panel .dp-body { font-size:0.92em; color:#b0bec5; line-height:1.8; }
  .page-footer {
    margin:28px 0 0;
    padding:18px 20px;
    border-top:1px solid var(--border);
    color:var(--dim);
    font-size:0.88em;
    text-align:center;
  }

  .dp-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:14px; margin-top:14px; }
  .dp-item {
    background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.05);
    border-radius:8px; padding:14px 16px;
  }
  .dp-item .dp-k { font-size:0.72em; color:var(--dim); margin-bottom:4px; letter-spacing:0.04em; }
  .dp-item .dp-v { font-size:0.88em; color:var(--bright); font-family:'JetBrains Mono',monospace; }

  .dp-code {
    background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.08);
    border-radius:8px; padding:14px 16px; margin-top:12px;
    font-family:'JetBrains Mono',monospace; font-size:0.78em;
    color:#a5d6a7; overflow-x:auto; white-space:pre; line-height:1.55;
  }
  .dp-code .kw { color:#82aaff; }
  .dp-code .str { color:#c3e88d; }
  .dp-code .cmt { color:#546e7a; }
  .dp-code .fn { color:#ffcb6b; }

  /* ===== PROGRESS BAR ===== */
  .progress-bar {
    width:100%; height:3px; background:var(--border);
    border-radius:2px; margin-top:24px; overflow:hidden;
  }
  .progress-fill {
    height:100%; background:linear-gradient(90deg,var(--blue),var(--purple),var(--red));
    border-radius:2px; transition:width 0.6s;
  }

  /* ===== PARTICLE CANVAS ===== */
  #particles {
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:0;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width:900px) {
    .pipeline { flex-wrap:wrap; }
    .connector { width:100%; height:16px; }
    .connector::after { display:none; }
    .node { flex:auto; min-width:25%; padding:16px 4px; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="topbar">
  <h1>RK3568 <span>AI Camera</span> &mdash; 数据流动画演示</h1>
  <div class="controls">
    <button id="btnAuto" class="active" onclick="toggleAuto()">&#x23F5; 自动播放</button>
    <button id="btnPrev" onclick="stepPrev()">&#x23EE; 上一步</button>
    <button id="btnNext" onclick="stepNext()">&#x23ED; 下一步</button>
    <button id="btnReset" onclick="stepReset()">&#x21BA; 重置</button>
    <span class="step-indicator" id="stepLabel">0 / 10</span>
  </div>
</div>

<div class="main">

  <div class="helper-note">

    页面里出现的 <code>/userdata/...</code> 等路径为板端路径；仓库内文件和本机路径请以实际环境为准。
  </div>

  <div class="pipeline-container">
    <div class="data-badge" id="dataBadge"></div>
    <div class="pipeline" id="pipeline">
      <!-- injected by JS -->
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <!-- injected by JS -->
  </div>

  <div class="page-footer">
    返回 Obsidian 主入口：00-RK3568学习主入口.md
  </div>

</div>

    badge: 'JPEG → FFmpeg libx264 → RTMP → Nginx → HLS · ~5 FPS',
    details: [

      { k:'Nginx 版本', v:'1.12.2 + nginx-rtmp v1.2.1' },
      { k:'RTMP 端口', v:'1935 (Nginx RTMP module)' },
      { k:'HLS 路径', v:'/tmp/hls/yolo.m3u8' },
      { k:'拉流地址', v:'http://192.168.0.230/hls/yolo.m3u8' },
      { k:'帧率', v:'~4.9-5.1 FPS' },

    ],
    code: '# 板端: 一键启动完整演示\n'+
           'cd /userdata/aidemo/06_yolov5_python\n'+

const nodes = [
  { icon:'📷', label:'IMX415\nSensor', sub:'imx415.c' },
  { icon:'⚡', label:'MIPI CSI\nDPHY', sub:'phy-rockchip-inno-csidphy' },
  { icon:'📡', label:'ISP 2.1\nPipeline', sub:'rkisp1 · 0xFDFE0000' },
  { icon:'📂', label:'V4L2 &\nMedia Ctrl', sub:'/dev/video0 · /dev/media0' },
  { icon:'🔧', label:'GStreamer\n1.20', sub:'v4l2src ! videoconvert ! appsink' },
  { icon:'👁️', label:'OpenCV\n4.5.5', sub:'cv2.VideoCapture(CAP_GSTREAMER)' },
  { icon:'🧠', label:'RKNN\nNPU', sub:'librknnrt.so · 0.8TOPS INT8' },
  { icon:'✏️', label:'后处理\n& NMS', sub:'decode + NMS + draw' },
  { icon:'🖥️', label:'VOP2 →\nMIPI DSI', sub:'rockchip-drm · 0xFE040000' },
  { icon:'📡', label:'FFmpeg →\nRTMP → HLS', sub:'Nginx · Windows ffplay' },
];

// ===== BUILD PIPELINE =====
const pipeline = document.getElementById('pipeline');
nodes.forEach((n, i) => {
  if (i > 0) {
    const conn = document.createElement('div');
    conn.className = 'connector';
    conn.dataset.idx = i - 1;
    pipeline.appendChild(conn);
  }
  const div = document.createElement('div');
  div.className = 'node';
  div.dataset.idx = i;
  div.innerHTML = `<span class="n-icon">${n.icon}</span><div class="n-label">${n.label.replace(/\n/g,'<br>')}</div><div class="n-sub">${n.sub}</div>`;
  pipeline.appendChild(div);
});

let currentStep = -1;
let autoTimer = null;
let isAuto = true;

function getColor(i) {
  const colors = ['var(--blue)','var(--cyan)','var(--purple)','var(--green)','var(--cyan)','var(--orange)','var(--red)','var(--orange)','var(--green)','var(--pink)'];
  return colors[i] || 'var(--purple)';
}

function updateUI() {
  // Update pipeline nodes
  document.querySelectorAll('.node').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    el.classList.remove('active','done');
    el.style.background = '';
    el.style.borderColor = '';
    if (idx < currentStep) el.classList.add('done');
    if (idx === currentStep) {
      el.classList.add('active');
      el.style.background = `rgba(124,77,255,0.12)`;
      el.style.borderColor = getColor(idx);
    }
  });

  // Update connectors
  document.querySelectorAll('.connector').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    el.classList.toggle('flow', idx < currentStep);
  });

  // Update data badge
  const badge = document.getElementById('dataBadge');
  if (currentStep >= 0 && currentStep < steps.length) {
    badge.textContent = steps[currentStep].badge;
    badge.className = 'data-badge show';
    const activeNode = document.querySelector(`.node[data-idx="${currentStep}"]`);
    if (activeNode) {
      const nodeRect = activeNode.getBoundingClientRect();
      const pipeRect = pipeline.getBoundingClientRect();
      badge.style.left = (nodeRect.left + nodeRect.width/2 - pipeRect.left) + 'px';
    }
  } else {
    badge.className = 'data-badge';
  }

  // Update detail panel
  const dp = document.getElementById('detailPanel');
  if (currentStep >= 0 && currentStep < steps.length) {
    const s = steps[currentStep];
    let html = `<div class="dp-step">Step ${currentStep + 1} / ${steps.length}</div>`;
    html += `<div class="dp-title">${s.title}</div>`;
    html += `<div class="dp-body">${s.body}</div>`;
    if (s.details.length > 0) {
      html += '<div class="dp-grid">';
      s.details.forEach(d => {
        html += `<div class="dp-item"><div class="dp-k">${d.k}</div><div class="dp-v">${d.v}</div></div>`;
      });
      html += '</div>';
    }
    if (s.code) {
      html += `<div class="dp-code">${s.code}</div>`;
    }
    dp.innerHTML = html;
  } else {
    dp.innerHTML = `
      <div class="dp-step">就绪</div>
      <div class="dp-title">RK3568 AI Camera 全链路数据流动画</div>
      <div class="dp-body">
        点击 <strong>"自动播放"</strong> 按钮开始，或使用 <strong>上一步/下一步</strong> 手动浏览。<br>
        每步展示数据在芯片内部经过的完整路径，从 Camera 传感器到 AI 推理再到显示和推流。
      </div>`;
  }

  // Progress bar
  const pct = steps.length > 0 ? ((currentStep + 1) / steps.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';

  // Step label
  document.getElementById('stepLabel').textContent = `${Math.max(0, currentStep + 1)} / ${steps.length}`;

  // Button states
  document.getElementById('btnPrev').disabled = currentStep <= 0;
  document.getElementById('btnNext').disabled = currentStep >= steps.length - 1;
}

function stepNext() {
  if (currentStep < steps.length - 1) {
    currentStep++;
    updateUI();
  } else if (currentStep >= steps.length - 1) {
    stopAuto();
  }
}

function stepPrev() {
  if (currentStep > -1) {
    currentStep--;
    updateUI();
  }
}

function stepReset() {
  currentStep = -1;
  updateUI();
}

function toggleAuto() {
  if (isAuto) {
    stopAuto();
  } else {
    startAuto();
  }
}

function startAuto() {
  isAuto = true;
  document.getElementById('btnAuto').classList.add('active');
  document.getElementById('btnAuto').innerHTML = '⏵ 自动播放';
  if (currentStep >= steps.length - 1) currentStep = -1;
  autoStep();
}

function stopAuto() {
  isAuto = false;
  document.getElementById('btnAuto').classList.remove('active');
  document.getElementById('btnAuto').innerHTML = '▶ 手动模式';
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
}

function autoStep() {
  if (!isAuto) return;
  if (currentStep < steps.length - 1) {
    stepNext();
    autoTimer = setTimeout(autoStep, 3500);
  } else {
    // loop back
    autoTimer = setTimeout(() => {
      currentStep = -1;
      updateUI();
      autoTimer = setTimeout(autoStep, 1500);
    }, 4000);
  }
}

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); stepNext(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepPrev(); }
  if (e.key === 'r') { stepReset(); }
  if (e.key === 'p') { toggleAuto(); }
});

// ===== BACKGROUND PARTICLES =====
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

for (let i = 0; i < 40; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5 + 0.5,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    alpha: Math.random() * 0.4 + 0.1,
  });
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(124,77,255,${p.alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ===== INIT =====
updateUI();
startAuto();
</script>
</body>
</html>
